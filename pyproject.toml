[project]
name = "leetcode"
version = "0.1.0"
description = "Python solutions and tests for Leetcode problems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "prek>=0.4.11",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = [
    ".",
]
python_files = [
    "test_*.py",
]

[tool.ruff]
target-version = "py310"
